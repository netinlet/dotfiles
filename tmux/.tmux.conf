# Portable tmux configuration; keymap matches ~/.config/herdr/config.toml.
# Install as ~/.tmux.conf. Reload with Ctrl-a, r.

# Press Ctrl-a, release, then the command key.
unbind C-b
set -g prefix C-a
bind a send-prefix
bind r source-file ~/.tmux.conf

# Split top/bottom with -, left/right with |.
# Keep new panes in the active pane's working directory.
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Focus left/down/up/right; Shift resizes by five cells.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Preserve the existing window/session shortcuts.
bind Tab last-window
bind Escape copy-mode
bind S command-prompt "switch-client -t '%%'"
set -g base-index 1
set -g automatic-rename off

# Use terminal-independent copy mode; no macOS clipboard helper required.
set -g mouse off
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# Portable terminal type and status line; no external scripts required.
set -g default-terminal "screen-256color"
set -g status-style "bg=black,fg=green"
set -g status-left '#h:[#S]'
set -g status-left-length 50
set -g status-right-length 50
set -g status-right "%H:%M %d-%b-%Y"
setw -g window-status-current-format "|#I:#W|"
setw -g window-status-current-style "fg=colour166,bg=black"
set -g bell-action any
setw -g window-status-bell-style "fg=red,bg=white"
